server:
  port: 8080

spring:
  application:
    name: voyage-ai-backend
  jackson:
    property-naming-strategy: SNAKE_CASE   # même format JSON que le service Python et le frontend
    default-property-inclusion: non_null
  datasource:
    url: jdbc:h2:file:./data/voyageai;AUTO_SERVER=true
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

ml:
  base-url: ${ML_BASE_URL:http://localhost:8000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
