services:
  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      ML_BASE_URL: http://ml-service:8000
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    volumes:
      - backend-data:/app/data
    depends_on:
      ml-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on:
      - backend

volumes:
  backend-data:
